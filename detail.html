<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目详情 | Vibe Coder</title>
  <meta name="description" content="Vibe Coder 项目详情页">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="background-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="site-wrapper detail-main">
    <section class="section reveal">
      <div class="detail-shell glass-panel">
        <a class="back-link" href="index.html">← 返回主页</a>
        <p id="detail-category" class="detail-category"></p>
        <h1 id="detail-title" class="detail-title"></h1>
        <p id="detail-tagline" class="detail-tagline"></p>

        <div id="detail-special-note" class="detail-special-note" hidden></div>
        <div id="detail-links" class="detail-links"></div>
      </div>
    </section>

    <section class="section reveal">
      <div class="detail-content-grid">
        <article class="detail-card glass-panel">
          <h2>项目概述</h2>
          <p id="detail-summary"></p>
          <p id="detail-positioning"></p>
        </article>

        <article class="detail-card glass-panel">
          <h2>核心模块</h2>
          <ul id="detail-modules"></ul>
        </article>

        <article class="detail-card glass-panel">
          <h2>关键流程</h2>
          <ol id="detail-flow"></ol>
        </article>

        <article class="detail-card glass-panel">
          <h2>技术与产出</h2>
          <ul id="detail-stack"></ul>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer reveal">
    <div class="footer-inner glass-panel">
      <p class="copyright">© <span id="year"></span> Vibe Coder</p>
    </div>
  </footer>

  <script src="js/detail-data.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
